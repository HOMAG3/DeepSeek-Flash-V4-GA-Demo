<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>卡冈图雅 GARGANTUA · 星际穿越黑洞模拟</title>
<style>
:root{color-scheme:dark}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif}
canvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%;cursor:grab}
canvas.dragging{cursor:grabbing}
#title{position:fixed;top:26px;left:50%;transform:translateX(-50%);z-index:20;color:#fff;font-size:clamp(20px,3vw,28px);letter-spacing:.42em;font-weight:300;text-shadow:0 0 18px rgba(255,255,255,.4),0 0 60px rgba(255,190,110,.28);pointer-events:none;white-space:nowrap}
#subtitle{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:20;color:rgba(255,255,255,.42);font-size:clamp(10px,1.3vw,13px);letter-spacing:.26em;font-weight:300;pointer-events:none;white-space:nowrap}
#hint{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:20;color:rgba(255,255,255,.30);font-size:12px;letter-spacing:.14em;pointer-events:none;white-space:nowrap}
#fps{position:fixed;bottom:26px;right:26px;z-index:20;color:rgba(255,255,255,.45);font-size:12px;font-family:Consolas,monospace;pointer-events:none}
#panel{position:fixed;top:14px;right:14px;z-index:30;width:268px;background:rgba(8,10,14,.72);border:1px solid rgba(255,255,255,.10);border-radius:12px;padding:14px 16px 12px;color:#dfe5ee;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);user-select:none;max-height:calc(100vh - 28px);overflow-y:auto}
#panel::-webkit-scrollbar{width:5px}
#panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}
#panel h2{font-size:13px;font-weight:500;letter-spacing:.18em;color:#fff;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
#panel h2 button{background:none;border:none;color:rgba(255,255,255,.45);cursor:pointer;font-size:13px;padding:2px 6px}
.modes{display:flex;gap:6px;margin-bottom:12px}
.modes button{flex:1;padding:7px 0;font-size:12px;letter-spacing:.08em;border-radius:7px;cursor:pointer;background:rgba(255,255,255,.06);color:#cfd6e2;border:1px solid rgba(255,255,255,.12);transition:all .15s}
.modes button.on{background:rgba(255,190,110,.16);color:#ffd9a0;border-color:rgba(255,190,110,.55)}
.ctrl{margin:9px 0}
.ctrl label{display:flex;justify-content:space-between;font-size:12px;color:#aab3c2;margin-bottom:3px}
.ctrl label span{color:#e8edf4;font-family:Consolas,monospace;font-size:11px}
.ctrl input[type=range]{width:100%;height:3px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.16);border-radius:2px;outline:none}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#ffc46b;cursor:pointer;border:none;box-shadow:0 0 8px rgba(255,180,80,.55)}
.check{display:flex;align-items:center;gap:7px;font-size:12px;color:#aab3c2;margin:7px 0;cursor:pointer}
.check input{accent-color:#ffb95e;width:14px;height:14px;cursor:pointer}
select{width:100%;background:rgba(255,255,255,.07);color:#e8edf4;border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:6px 8px;font-size:12px;outline:none;cursor:pointer}
.btnrow{display:flex;gap:6px;margin-top:10px}
.btnrow button{flex:1;padding:7px 0;font-size:12px;border-radius:7px;cursor:pointer;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:#e8edf4;transition:all .15s}
.btnrow button:hover{background:rgba(255,255,255,.15)}
.sep{height:1px;background:rgba(255,255,255,.09);margin:11px 0}
#error{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:100;display:none;font-size:15px;text-align:center;color:#ff6b6b;background:rgba(0,0,0,.9);padding:38px 46px;border-radius:10px;line-height:1.8;max-width:88vw}
@media (max-width:640px){
#panel{width:230px;padding:10px 12px}
#title{font-size:16px;letter-spacing:.3em}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">卡冈图雅 GARGANTUA</div>
<div id="subtitle">星际穿越 · Kerr 时空光线追踪</div>
<div id="hint">拖拽旋转 · 滚轮缩放 · 片刻后自动环绕</div>
<div id="fps">-- FPS</div>
<div id="panel">
<h2>控制面板 <button id="togglePanel" title="收起/展开">−</button></h2>
<div id="panelBody">
<div class="modes">
<button id="modeMovie" class="on">电影质感</button>
<button id="modePhys">真实物理</button>
</div>
<div class="ctrl">
<label>自旋 a <span id="vSpin">0.600</span></label>
<input type="range" id="spin" min="0" max="0.998" step="0.001" value="0.6">
</div>
<div class="ctrl">
<label>观测仰角 <span id="vElev">4°</span></label>
<input type="range" id="elev" min="-35" max="35" step="1" value="4">
</div>
<div class="ctrl">
<label>观测距离 <span id="vDist">18.0 M</span></label>
<input type="range" id="dist" min="6" max="80" step="0.5" value="18">
</div>
<div class="ctrl">
<label>视场 <span id="vFov">48°</span></label>
<input type="range" id="fov" min="25" max="90" step="1" value="48">
</div>
<div class="sep"></div>
<div class="ctrl">
<label>吸积盘亮度 <span id="vDisk">1.00</span></label>
<input type="range" id="disk" min="0.2" max="3" step="0.05" value="1">
</div>
<div class="ctrl">
<label>光子环强度 <span id="vRing">1.00</span></label>
<input type="range" id="ring" min="0" max="3" step="0.05" value="1">
</div>
<div class="ctrl">
<label>辉光强度 <span id="vBloom">1.15</span></label>
<input type="range" id="bloom" min="0" max="3" step="0.05" value="1.15">
</div>
<div class="ctrl">
<label>星场亮度 <span id="vStar">1.00</span></label>
<input type="range" id="star" min="0" max="3" step="0.05" value="1">
</div>
<div class="sep"></div>
<label class="check"><input type="checkbox" id="doppler">多普勒效应（物理）</label>
<label class="check"><input type="checkbox" id="redshift">引力红移（物理）</label>
<label class="check"><input type="checkbox" id="flare" checked>IMAX 镜头眩光</label>
<label class="check"><input type="checkbox" id="texture" checked>盘面湍流纹理</label>
<label class="check"><input type="checkbox" id="autorotate" checked>自动环绕</label>
<div class="sep"></div>
<div class="ctrl">
<label>画质</label>
<select id="quality">
<option value="0">流畅</option>
<option value="1" selected>均衡</option>
<option value="2">高画质</option>
<option value="3">极致</option>
</select>
</div>
<div class="btnrow">
<button id="shot" title="保存当前画面为 PNG">截图</button>
<button id="reset" title="恢复默认视角">重置视角</button>
</div>
</div>
</div>
<div id="error"></div>
<script>
(function(){
'use strict';
var canvas = document.getElementById('c');
var fpsEl = document.getElementById('fps');
var errorEl = document.getElementById('error');
function showError(msg){
errorEl.textContent = msg;
errorEl.style.display = 'block';
}
var gl = canvas.getContext('webgl2', {
antialias: false,
preserveDrawingBuffer: true,
powerPreference: 'high-performance'
});
if(!gl){ showError('需要 WebGL2 支持\n请使用最新版 Chrome / Edge / Firefox'); return; }
if(!gl.getExtension('EXT_color_buffer_float')){
showError('需要 EXT_color_buffer_float 扩展\n请更新浏览器或显卡驱动');
return;
}// ============ 着色器源码 ============
var quadVertSrc = `#version 300 es
out vec2 vUv;
void main(){
  vec2 uv = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  vUv = uv;
  gl_Position = vec4(uv * 2.0 - 1.0, 0.0, 1.0);
}`;
// —— 主场景：Kerr–Schild 零测地线光线追踪 ——
var sceneFragSrc = `#version 300 es
precision highp float;
uniform vec2  uResolution;
uniform float uTime;
uniform vec3  uCamPos;
uniform vec3  uCamForward;
uniform vec3  uCamRight;
uniform vec3  uCamUp;
uniform vec2  uFovScale;
uniform float uSpin;
uniform int   uMaxSteps;
uniform float uDiskBright;
uniform float uRingBoost;
uniform float uDoppler;
uniform float uRedshift;
uniform float uStarBright;
uniform float uTexOn;
uniform float uDiskThick;
out vec4 fragColor;
float hash31(vec3 p){
  p = fract(p * 0.3183099 + vec3(0.1, 0.2, 0.3));
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}
float hash21(vec2 p){
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash21(i);
  float b = hash21(i + vec2(1,0));
  float c = hash21(i + vec2(0,1));
  float d = hash21(i + vec2(1,1));
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
}
float fbm(vec2 p){
  float v = 0.0, amp = 0.5;
  for(int i = 0; i < 4; i++){
    v += amp * vnoise(p);
    p = p * 2.03 + 11.7;
    amp *= 0.5;
  }
  return v;
}
// Kerr-Schild 坐标量：(r, F, l, ∇r)，M=1
void ksCoords(vec3 x, float a, out float r, out float F, out vec3 l, out vec3 rg){
  float a2 = a * a;
  float rho2 = dot(x, x);
  float q = rho2 - a2;
  float s = sqrt(max(q*q + 4.0*a2*x.z*x.z, 0.0));
  if(s < 1e-9) s = 1e-9;
  float r2 = 0.5 * (q + s);
  r2 = max(r2, 1e-8);
  r = sqrt(r2);
  if(r < 1e-3) r = 1e-3;
  float inv2r = 0.5 / r;
  rg = vec3(x.x*(1.0+q/s)*inv2r,
            x.y*(1.0+q/s)*inv2r,
            x.z*(1.0+(q+2.0*a2)/s)*inv2r);
  float D = max(r2*r2 + a2*x.z*x.z, 1e-8);
  F = 2.0 * r2 * r / D;
  float K = r2 + a2;
  l = vec3((r*x.x + a*x.y)/K,
           (r*x.y - a*x.x)/K,
           x.z/r);
}
// 测地线导数（p0 = -1）
void ksDeriv(vec3 x, vec3 p, float a, out vec3 dx, out vec3 dp){
  float r, F;
  vec3 l, rg;
  ksCoords(x, a, r, F, l, rg);
  float a2 = a*a, r2 = r*r;
  float K = r2 + a2;
  float D = max(r2*r2 + a2*x.z*x.z, 1e-8);
  vec3 Dg = vec3(4.0*r2*r*rg.x, 4.0*r2*r*rg.y, 4.0*r2*r*rg.z + 2.0*a2*x.z);
  vec3 Fg = F * (3.0*rg/r - Dg/D);
  float Nx = r*x.x + a*x.y;
  float Ny = r*x.y - a*x.x;
  vec3 Kg = 2.0 * r * rg;
  float K2 = K * K;
  vec3 dlx = vec3(((r + x.x*rg.x)*K - Nx*Kg.x)/K2,
                  ((a + x.x*rg.y)*K - Nx*Kg.y)/K2,
                  (x.x*rg.z*K - Nx*Kg.z)/K2);
  vec3 dly = vec3(((x.y*rg.x - a)*K - Ny*Kg.x)/K2,
                  ((r + x.y*rg.y)*K - Ny*Kg.y)/K2,
                  (x.y*rg.z*K - Ny*Kg.z)/K2);
  vec3 dlz = vec3(-x.z*rg.x/r2, -x.z*rg.y/r2, (r - x.z*rg.z)/r2);
  float P = dot(l, p);
  vec3 Pg = vec3(p.x*dlx.x + p.y*dly.x + p.z*dlz.x,
                 p.x*dlx.y + p.y*dly.y + p.z*dlz.y,
                 p.x*dlx.z + p.y*dly.z + p.z*dlz.z);
  float t = P + 1.0;
  dp = 0.5*Fg*t*t + F*t*Pg;
  dx = p - F*l*t;
}
// 构造零动量：速度方向平行于 d，且 H=0
vec3 initMom(vec3 d, vec3 x, float a){
  float r, F;
  vec3 l, rg;
  ksCoords(x, a, r, F, l, rg);
  float Ld = dot(l, d);
  float k = inversesqrt(max(1.0 - F + F*Ld*Ld, 1e-9));
  float u = (k*Ld + 1.0) / max(1.0 - F, 1e-6);
  return k*d + F*l*u;
}
float iscoR(float a){
  float Z1 = 1.0 + pow(max(1.0 - a*a, 0.0), 1.0/3.0)
                  * (pow(1.0 + a, 1.0/3.0) + pow(1.0 - a, 1.0/3.0));
  float Z2 = sqrt(3.0*a*a + Z1*Z1);
  return 3.0 + Z2 - sqrt(max((3.0 - Z1)*(3.0 + Z1 + 2.0*Z2), 0.0));
}vec3 blackbody(float T){
  T = clamp(T, 1800.0, 15000.0);
  vec3 c1 = vec3(1.00, 0.22, 0.02);
  vec3 c2 = vec3(1.00, 0.46, 0.09);
  vec3 c3 = vec3(1.00, 0.75, 0.36);
  vec3 c4 = vec3(1.00, 0.95, 0.83);
  vec3 c5 = vec3(1.00, 0.98, 0.96);
  vec3 c6 = vec3(0.93, 0.97, 1.00);
  if(T < 2800.0) return mix(c1, c2, (T - 1800.0)/1000.0);
  if(T < 4200.0) return mix(c2, c3, (T - 2800.0)/1400.0);
  if(T < 5800.0) return mix(c3, c4, (T - 4200.0)/1600.0);
  if(T < 7500.0) return mix(c4, c5, (T - 5800.0)/1700.0);
  return mix(c5, c6, (T - 7500.0)/3500.0);
}
// 吸积盘辐射：温度剖面 + 红移/多普勒 + 湍流纹理
vec3 shadeDisk(vec3 xc, vec3 pc, float r, float a, float gObs){
  float risco = iscoR(a);
  float g = 1.0;
  if(uRedshift > 0.5 || uDoppler > 0.5){
    float omega = 1.0 / (pow(r, 1.5) + a);
    float gtt = -(1.0 - 2.0/r);
    float gtp = -2.0*a/r;
    float gpp = r*r + a*a + 2.0*a*a/r;
    float ut = inversesqrt(max(-gtt - 2.0*gtp*omega - gpp*omega*omega, 1e-6));
    float rho = max(length(xc.xy), 1e-4);
    float pphi = xc.x*pc.y - xc.y*pc.x;
    float dop = (uDoppler > 0.5) ? omega*pphi/rho : 0.0;
    float pdotu = ut * (-1.0 + dop);
    g = gObs / min(pdotu, -1e-6);
    g = clamp(g, 0.3, 2.2);
  }
  float T = 12500.0 * pow(risco/r, 0.58)
          * pow(clamp(1.0 - 0.86*sqrt(risco/r), 0.06, 1.0), 0.22);
  float Tobs = T * g;
  vec3 col = blackbody(Tobs);
  float f = clamp(1.0 - sqrt(risco/r), 0.0, 1.0);
  float bright = pow(risco/r, 1.9) * (0.22 + 0.78*pow(f, 0.32));
  bright *= smoothstep(risco - 0.18, risco + 0.25, r);
  bright *= 1.0 - smoothstep(9.5, 12.5, r);
  bright *= 1.0 + uRingBoost * 6.0 * exp(-pow((r - risco)/0.30, 2.0))
                  * mix(1.0, pow(g, 1.5), uRedshift);
  bright *= 1.6;
  if(uRedshift > 0.5) bright *= pow(g, 2.0);
  col *= bright * uDiskBright;
  if(uTexOn > 0.5){
    float ang = atan(xc.y, xc.x);
    float om = 1.0 / (pow(r, 1.5) + a);
    float n  = fbm(vec2(r*1.4, ang*2.2 - uTime*om*1.2));
    float st = fbm(vec2(r*3.2, ang*9.0 - uTime*om*4.0));
    col *= 1.0 + 0.32*(n - 0.5) + 0.16*(st - 0.5);
  }
  return col;
}
vec3 starfield(vec3 d){
  d = normalize(d);
  vec3 col = vec3(0.0);
  for(int layer = 0; layer < 3; layer++){
    float cells = layer == 0 ? 220.0 : (layer == 1 ? 520.0 : 1050.0);
    vec3 cell = floor(d * cells);
    vec3 seed = cell + vec3(17.0*float(layer), 31.0*float(layer), 7.0*float(layer));
    float h = hash31(seed);
    float thr = layer == 0 ? 0.960 : (layer == 1 ? 0.982 : 0.996);
    float mag = smoothstep(thr, 1.0, h);
    vec3 fp = fract(d * cells);
    vec3 cp = vec3(0.5) + (hash31(seed + 5.0) - 0.5) * 0.82;
    float dist = length(fp - cp);
    float size = layer == 0 ? 0.024 : (layer == 1 ? 0.016 : 0.010);
    float star = smoothstep(size, 0.0, dist);
    float cool = hash31(seed + 99.0);
    vec3 scol = mix(vec3(0.78, 0.87, 1.0), vec3(1.0, 0.93, 0.82), step(0.55, cool));
    float amp = layer == 0 ? 4.0 : (layer == 1 ? 2.0 : 1.0);
    col += star * mag * scol * amp;
  }
  vec3 gn = normalize(vec3(0.35, 0.87, 0.35));
  float band = pow(max(1.0 - abs(dot(d, gn)), 0.0), 3.2);
  float n0 = fbm(d.xy*7.0 + d.z*3.0);
  float n1 = fbm(d.yz*9.0 + d.x*5.0);
  col += band * vec3(0.55, 0.62, 0.80) * (0.10 + 0.24*n0) * (0.7 + 0.3*n1);
  return col * uStarBright;
}
void main(){
  vec2 uv = gl_FragCoord.xy / uResolution;
  vec3 rd = normalize(uCamForward
    + uCamRight * (uv.x - 0.5) * uFovScale.x
    + uCamUp    * (uv.y - 0.5) * uFovScale.y);
  float a = uSpin;
  vec3 x = uCamPos;
  vec3 p = initMom(rd, x, a);
  float r0, F0;
  vec3 l0, rg0;
  ksCoords(x, a, r0, F0, l0, rg0);
  float gObs = -1.0 / sqrt(max(1.0 - F0, 1e-4));
  float rh = 1.0 + sqrt(max(1.0 - a*a, 0.0));
  float risco = iscoR(a);
  float rOut = 13.0;
  float hz = uDiskThick;
  vec3 col = vec3(0.0);
  bool done = false;
  float zPrev = x.z;
  for(int i = 0; i < 640; i++){
    if(i >= uMaxSteps) break;
    float r, F;
    vec3 l, rg;
    ksCoords(x, a, r, F, l, rg);
    if(r < rh){
      done = true;
      break;
    }
    float h = clamp(r * 0.045, 0.006, 1.0);
    vec3 k1x, k1p, k2x, k2p, k3x, k3p, k4x, k4p;
    ksDeriv(x, p, a, k1x, k1p);
    ksDeriv(x + 0.5*h*k1x, p + 0.5*h*k1p, a, k2x, k2p);
    ksDeriv(x + 0.5*h*k2x, p + 0.5*h*k2p, a, k3x, k3p);
    ksDeriv(x + h*k3x, p + h*k3p, a, k4x, k4p);
    vec3 xn = x + (h/6.0)*(k1x + 2.0*k2x + 2.0*k3x + k4x);
    vec3 pn = p + (h/6.0)*(k1p + 2.0*k2p + 2.0*k3p + k4p);
    if(!(dot(pn, pn) < 40000.0)){
      done = true;
      break;
    }
    if(zPrev * xn.z < 0.0 || (abs(xn.z) < hz && abs(x.z) < hz)){
      float t0 = clamp(zPrev / (zPrev - xn.z), 0.0, 1.0);
      vec3 xc = mix(x, xn, t0);
      vec3 pc = mix(p, pn, t0);
      float rho2 = dot(xc.xy, xc.xy);
      float rd = sqrt(max(rho2 - a*a, 0.0));
      float rks_c = sqrt(max(0.5*(rho2 - a*a + sqrt(max((rho2-a*a)*(rho2-a*a) + 4.0*a*a*xc.z*xc.z, 0.0))), 0.0));
      if(rd > risco - 0.25 && rd < rOut && rks_c > rh + 0.02){
        col = shadeDisk(xc, pc, rd, a, gObs);
        done = true;
        break;
      }
    }
    x = xn;
    p = pn;
    zPrev = x.z;
    if(r > 140.0){
      vec3 dx, dp;
      ksDeriv(x, p, a, dx, dp);
      col = starfield(dx);
      done = true;
      break;
    }
  }
  if(!done) col = vec3(0.0);
  fragColor = vec4(col, 1.0);
}`;
// —— 亮部提取 + 下采样 ——
var brightFragSrc = `#version 300 es
precision highp float;
uniform sampler2D uSceneTex;
uniform vec2 uTexelSize;
in vec2 vUv;
out vec4 fragColor;
void main(){
  vec2 o = uTexelSize * 0.5;
  vec3 c = texture(uSceneTex, vUv + vec2(-o.x,-o.y)).rgb
         + texture(uSceneTex, vUv + vec2( o.x,-o.y)).rgb
         + texture(uSceneTex, vUv + vec2(-o.x, o.y)).rgb
         + texture(uSceneTex, vUv + vec2( o.x, o.y)).rgb;
  vec3 avg = c * 0.25;
  float lum = dot(avg, vec3(0.2126, 0.7152, 0.0722));
  float f = smoothstep(0.42, 1.0, lum);
  fragColor = vec4(avg * f, 1.0);
}`;// —— 高斯模糊（H/V 两趟共用） ——
function blurSrc(axis){
  var d = axis === 'h' ? 'vec2(1.0,0.0)' : 'vec2(0.0,1.0)';
  return `#version 300 es
precision highp float;
uniform sampler2D uTex;
uniform vec2 uTexelSize;
in vec2 vUv;
out vec4 fragColor;
void main(){
  vec3 c = vec3(0.0);
  c += texture(uTex, vUv + ${d} * -4.0 * uTexelSize).rgb * 0.028;
  c += texture(uTex, vUv + ${d} * -3.0 * uTexelSize).rgb * 0.066;
  c += texture(uTex, vUv + ${d} * -2.0 * uTexelSize).rgb * 0.124;
  c += texture(uTex, vUv + ${d} * -1.0 * uTexelSize).rgb * 0.180;
  c += texture(uTex, vUv).rgb * 0.204;
  c += texture(uTex, vUv + ${d} *  1.0 * uTexelSize).rgb * 0.180;
  c += texture(uTex, vUv + ${d} *  2.0 * uTexelSize).rgb * 0.124;
  c += texture(uTex, vUv + ${d} *  3.0 * uTexelSize).rgb * 0.066;
  c += texture(uTex, vUv + ${d} *  4.0 * uTexelSize).rgb * 0.028;
  fragColor = vec4(c, 1.0);
}`;
}
// —— 合成：ACES、泛光、IMAX 眩光、暗角、颗粒 ——
var compositeFragSrc = `#version 300 es
precision highp float;
uniform sampler2D uSceneTex;
uniform sampler2D uBloomTex;
uniform vec2 uResolution;
uniform vec2 uBloomTexel;
uniform float uTime;
uniform float uExposure;
uniform float uBloomAmt;
uniform float uFlare;
in vec2 vUv;
out vec4 fragColor;
vec3 aces(vec3 x){
  return clamp((x*(2.51*x + 0.03))/(x*(2.43*x + 0.59) + 0.14), 0.0, 1.0);
}
float h2(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
void main(){
  vec2 cc = vUv - 0.5;
  float ca = 0.0018 * length(cc);
  vec3 scene;
  scene.r = texture(uSceneTex, vUv + cc*ca).r;
  scene.g = texture(uSceneTex, vUv).g;
  scene.b = texture(uSceneTex, vUv - cc*ca).b;
  scene *= uExposure;
  vec3 bloom = vec3(0.0);
  float w[5] = float[](0.227, 0.194, 0.121, 0.054, 0.016);
  vec2 off = vec2(1.0, 0.0);
  bloom += texture(uBloomTex, vUv).rgb * w[0];
  for(int i = 1; i < 5; i++){
    bloom += texture(uBloomTex, vUv + off * float(i) * uBloomTexel).rgb * w[i];
    bloom += texture(uBloomTex, vUv - off * float(i) * uBloomTexel).rgb * w[i];
  }
  off = vec2(0.0, 1.0);
  bloom += texture(uBloomTex, vUv + off * uBloomTexel).rgb * w[1];
  bloom += texture(uBloomTex, vUv - off * uBloomTexel).rgb * w[1];
  bloom += texture(uBloomTex, vUv + off * 2.0 * uBloomTexel).rgb * w[2];
  bloom += texture(uBloomTex, vUv - off * 2.0 * uBloomTexel).rgb * w[2];
  bloom += texture(uBloomTex, vUv + off * 3.0 * uBloomTexel).rgb * w[3];
  bloom += texture(uBloomTex, vUv - off * 3.0 * uBloomTexel).rgb * w[3];
  vec3 col = scene + bloom * uBloomAmt;
  if(uFlare > 0.5){
    vec3 flare = vec3(0.0);
    for(int k = 1; k <= 10; k++){
      float fk = float(k);
      float wgt = 0.055 / (1.0 + fk * 0.42);
      vec2 ox = vec2(fk * 0.012, 0.0);
      flare += texture(uBloomTex, vUv + ox).rgb * wgt;
      flare += texture(uBloomTex, vUv - ox).rgb * wgt;
    }
    flare *= vec3(0.68, 0.88, 1.22);
    vec3 vf = vec3(0.0);
    for(int k = 1; k <= 4; k++){
      float fk = float(k);
      float wgt = 0.045 / (1.0 + fk * 0.7);
      vec2 oy = vec2(0.0, fk * 0.005);
      vf += texture(uBloomTex, vUv + oy).rgb * wgt;
      vf += texture(uBloomTex, vUv - oy).rgb * wgt;
    }
    vf *= vec3(1.1, 0.9, 0.75);
    col += (flare + vf) * uFlare;
  }
  col = aces(col);
  float vig = 1.0 - smoothstep(0.42, 1.05, length(cc) * 2.0);
  col *= mix(vig, 1.0, 0.42);
  col += (h2(vUv * uResolution + uTime * 50.0) - 0.5) * 0.022;
  fragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;
// ============ 编译辅助 ============
function createShader(type, src){
  var s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    console.error('Shader error:', gl.getShaderInfoLog(s));
    return null;
  }
  return s;
}
function createProgram(vs, fs){
  var p = gl.createProgram();
  gl.attachShader(p, vs);
  gl.attachShader(p, fs);
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)){
    console.error('Link error:', gl.getProgramInfoLog(p));
    return null;
  }
  return p;
}
var vsShared = createShader(gl.VERTEX_SHADER, quadVertSrc);
var sceneProg  = createProgram(vsShared, createShader(gl.FRAGMENT_SHADER, sceneFragSrc));
var brightProg = createProgram(vsShared, createShader(gl.FRAGMENT_SHADER, brightFragSrc));
var blurHProg  = createProgram(vsShared, createShader(gl.FRAGMENT_SHADER, blurSrc('h')));
var blurVProg  = createProgram(vsShared, createShader(gl.FRAGMENT_SHADER, blurSrc('v')));
var compProg   = createProgram(vsShared, createShader(gl.FRAGMENT_SHADER, compositeFragSrc));
gl.deleteShader(vsShared);
if(!sceneProg || !brightProg || !blurHProg || !blurVProg || !compProg){
  showError('着色器编译失败\n请查看浏览器控制台');
  return;
}
function unis(prog, names){
  var o = {};
  names.forEach(function(n){ o[n] = gl.getUniformLocation(prog, n); });
  return o;
}
var uScene = unis(sceneProg, ['uResolution','uTime','uCamPos','uCamForward','uCamRight','uCamUp','uFovScale','uSpin','uMaxSteps','uDiskBright','uRingBoost','uDoppler','uRedshift','uStarBright','uTexOn','uDiskThick']);
var uBright = unis(brightProg, ['uSceneTex','uTexelSize']);
var uBlurH  = unis(blurHProg, ['uTex','uTexelSize']);
var uBlurV  = unis(blurVProg, ['uTex','uTexelSize']);
var uComp   = unis(compProg, ['uSceneTex','uBloomTex','uResolution','uBloomTexel','uTime','uExposure','uBloomAmt','uFlare']);// ============ 渲染目标 ============
function mkTex(w, h){
  var t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
function mkFBO(tex){
  var f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  return f;
}
var texScene, fboScene, texBloom, fboBloom, texBlur, fboBlur;
var W = 0, H = 0, hW = 0, hH = 0;
function destroyTargets(){
  [texScene, texBloom, texBlur].forEach(function(t){ if(t) gl.deleteTexture(t); });
  [fboScene, fboBloom, fboBlur].forEach(function(f){ if(f) gl.deleteFramebuffer(f); });
}
function createTargets(w, h){
  destroyTargets();
  W = w; H = h;
  hW = Math.max(1, Math.floor(w/2));
  hH = Math.max(1, Math.floor(h/2));
  texScene = mkTex(W, H); fboScene = mkFBO(texScene);
  texBloom = mkTex(hW, hH); fboBloom = mkFBO(texBloom);
  texBlur  = mkTex(hW, hH); fboBlur  = mkFBO(texBlur);
}
// ============ 相机与交互 ============
var cam = { yaw: 0.5, pitch: 4 * Math.PI/180, dist: 18 };
var aspect = 1;
var dragging = false, lastAction = 0, mx = 0, my = 0;
canvas.addEventListener('pointerdown', function(e){
  dragging = true; lastAction = performance.now();
  mx = e.clientX; my = e.clientY;
  canvas.classList.add('dragging');
});
window.addEventListener('pointermove', function(e){
  if(!dragging) return;
  cam.yaw += (e.clientX - mx) * 0.005;
  cam.pitch -= (e.clientY - my) * 0.003;
  cam.pitch = Math.max(-0.7, Math.min(0.7, cam.pitch));
  mx = e.clientX; my = e.clientY;
  lastAction = performance.now();
});
window.addEventListener('pointerup', function(){
  dragging = false;
  canvas.classList.remove('dragging');
});
canvas.addEventListener('wheel', function(e){
  e.preventDefault();
  cam.dist *= Math.exp(e.deltaY * 0.0012);
  cam.dist = Math.max(6, Math.min(80, cam.dist));
  lastAction = performance.now();
}, { passive: false });
// ============ UI ============
var $ = function(id){ return document.getElementById(id); };
var spinEl = $('spin'), elevEl = $('elev'), distEl = $('dist'), fovEl = $('fov');
var diskEl = $('disk'), ringEl = $('ring'), bloomEl = $('bloom'), starEl = $('star');
var dopplerEl = $('doppler'), redshiftEl = $('redshift'), flareEl = $('flare');
var texEl = $('texture'), autoEl = $('autorotate'), qualityEl = $('quality');
var modeMovie = $('modeMovie'), modePhys = $('modePhys');
var panelBody = $('panelBody');
var params = {
  spin: 0.6, elevDeg: 4, dist: 18, fovDeg: 48,
  disk: 1.0, ring: 1.0, bloom: 1.15, star: 1.0,
  doppler: false, redshift: false, flare: true, tex: true, auto: true,
  quality: 1
};
// URL 参数覆盖：?q=0..3 画质，?yaw=&pitch=&dist= 视角（调试/测试用）
var qm = location.search.match(/[?&]q=(\d)/);
if(qm) params.quality = Math.max(0, Math.min(3, +qm[1]));
var ym = location.search.match(/[?&]yaw=([-\d.]+)/);
if(ym) cam.yaw = parseFloat(ym[1]);
var pm = location.search.match(/[?&]pitch=([-\d.]+)/);
if(pm) cam.pitch = parseFloat(pm[1]) * Math.PI/180;
var dm = location.search.match(/[?&]dist=([-\d.]+)/);
if(dm) cam.dist = parseFloat(dm[1]);
var sm = location.search.match(/[?&]spin=([\d.]+)/);
if(sm) params.spin = Math.max(0, Math.min(0.998, parseFloat(sm[1])));
var rm = location.search.match(/[?&]ring=([\d.]+)/);
if(rm) params.ring = parseFloat(rm[1]);
var dm2 = location.search.match(/[?&]doppler=([01])/);
if(dm2) params.doppler = dm2[1] === '1';
var rs = location.search.match(/[?&]redshift=([01])/);
if(rs) params.redshift = rs[1] === '1';
var dk = location.search.match(/[?&]disk=([\d.]+)/);
if(dk) params.disk = parseFloat(dk[1]);
qualityEl.value = params.quality;
function syncUI(){
  $('vSpin').textContent = params.spin.toFixed(3);
  $('vElev').textContent = Math.round(params.elevDeg) + '°';
  $('vDist').textContent = params.dist.toFixed(1) + ' M';
  $('vFov').textContent = Math.round(params.fovDeg) + '°';
  $('vDisk').textContent = params.disk.toFixed(2);
  $('vRing').textContent = params.ring.toFixed(2);
  $('vBloom').textContent = params.bloom.toFixed(2);
  $('vStar').textContent = params.star.toFixed(2);
}
spinEl.oninput = function(){ params.spin = +spinEl.value; syncUI(); };
elevEl.oninput = function(){ params.elevDeg = +elevEl.value; cam.pitch = params.elevDeg * Math.PI/180; syncUI(); };
distEl.oninput = function(){ params.dist = +distEl.value; cam.dist = params.dist; syncUI(); };
fovEl.oninput = function(){ params.fovDeg = +fovEl.value; syncUI(); };
diskEl.oninput = function(){ params.disk = +diskEl.value; syncUI(); };
ringEl.oninput = function(){ params.ring = +ringEl.value; syncUI(); };
bloomEl.oninput = function(){ params.bloom = +bloomEl.value; syncUI(); };
starEl.oninput = function(){ params.star = +starEl.value; syncUI(); };
dopplerEl.onchange = function(){ params.doppler = dopplerEl.checked; };
redshiftEl.onchange = function(){ params.redshift = redshiftEl.checked; };
flareEl.onchange = function(){ params.flare = flareEl.checked; };
texEl.onchange = function(){ params.tex = texEl.checked; };
autoEl.onchange = function(){ params.auto = autoEl.checked; };
qualityEl.onchange = function(){ params.quality = +qualityEl.value; resize(); };
function applyPreset(movie){
  params.movie = movie;
  modeMovie.classList.toggle('on', movie);
  modePhys.classList.toggle('on', !movie);
  params.spin    = movie ? 0.6   : 0.998;
  params.doppler = !movie;
  params.redshift = !movie;
  params.ring    = movie ? 1.0   : 0.45;
  params.flare   = movie;
  params.bloom   = movie ? 1.15  : 0.9;
  params.disk    = movie ? 1.0   : 2.4;
  spinEl.value = params.spin; dopplerEl.checked = params.doppler;
  redshiftEl.checked = params.redshift; flareEl.checked = params.flare;
  bloomEl.value = params.bloom;
  diskEl.value = params.disk;
  syncUI();
}
modeMovie.onclick = function(){ applyPreset(true); };
modePhys.onclick = function(){ applyPreset(false); };
$('reset').onclick = function(){
  cam.yaw = 0.5; cam.pitch = 4*Math.PI/180; cam.dist = 18;
  elevEl.value = 4; distEl.value = 18; fovEl.value = 48;
  params.elevDeg = 4; params.dist = 18; params.fovDeg = 48;
  syncUI();
};
$('shot').onclick = function(){
  var a = document.createElement('a');
  a.download = 'gargantua-' + Date.now() + '.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
};
$('togglePanel').onclick = function(){
  var hidden = panelBody.style.display === 'none';
  panelBody.style.display = hidden ? '' : 'none';
  this.textContent = hidden ? '−' : '+';
};
var QUALITY = [
  { scale: 0.5,  steps: 260 },
  { scale: 0.68, steps: 340 },
  { scale: 0.85, steps: 440 },
  { scale: 1.0,  steps: 560 }
];
function resize(){
  var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  var q = QUALITY[params.quality];
  var w = Math.max(2, Math.floor(window.innerWidth * dpr * q.scale));
  var h = Math.max(2, Math.floor(window.innerHeight * dpr * q.scale));
  canvas.width = Math.floor(window.innerWidth * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  aspect = canvas.width / canvas.height;
  createTargets(w, h);
}
window.addEventListener('resize', resize);
resize();
syncUI();
// ============ 渲染循环 ============
var fc = 0, lastFps = performance.now(), lastT = performance.now();
function render(now){
  requestAnimationFrame(render);
  if(W < 2 || H < 2) return;
  var dt = Math.min((now - lastT)/1000, 0.05);
  var rdt = Math.min((now - lastT)/1000, 0.5);
  lastT = now;
  fc++;
  if(now - lastFps > 500){
    fpsEl.textContent = Math.round(fc / ((now - lastFps)/1000)) + ' FPS';
    fc = 0; lastFps = now;
  }
  if(params.auto && !dragging && (now - lastAction) > 1500){
    cam.yaw += 0.07 * rdt;
  }
  var cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  var cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
  var cpos = {
    x: cam.dist * cp * sy,
    y: cam.dist * cp * cy,
    z: cam.dist * sp
  };
  var fl = Math.sqrt(cpos.x*cpos.x + cpos.y*cpos.y + cpos.z*cpos.z);
  var fwd = { x: -cpos.x/fl, y: -cpos.y/fl, z: -cpos.z/fl };
  var wup = { x: 0, y: 0, z: 1 };
  var rx = fwd.y*wup.z - fwd.z*wup.y;
  var ry = fwd.z*wup.x - fwd.x*wup.z;
  var rz = fwd.x*wup.y - fwd.y*wup.x;
  var rl = Math.sqrt(rx*rx + ry*ry + rz*rz) || 1;
  var right = { x: rx/rl, y: ry/rl, z: rz/rl };
  var up = {
    x: right.y*fwd.z - right.z*fwd.y,
    y: right.z*fwd.x - right.x*fwd.z,
    z: right.x*fwd.y - right.y*fwd.x
  };
  var thf = Math.tan(params.fovDeg * Math.PI/360);
  var fsx = 2 * thf * aspect;
  var fsy = 2 * thf;
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboScene);
  gl.viewport(0, 0, W, H);
  gl.useProgram(sceneProg);
  gl.uniform2f(uScene.uResolution, W, H);
  gl.uniform1f(uScene.uTime, now * 0.001);
  gl.uniform3f(uScene.uCamPos, cpos.x, cpos.y, cpos.z);
  gl.uniform3f(uScene.uCamForward, fwd.x, fwd.y, fwd.z);
  gl.uniform3f(uScene.uCamRight, right.x, right.y, right.z);
  gl.uniform3f(uScene.uCamUp, up.x, up.y, up.z);
  gl.uniform2f(uScene.uFovScale, fsx, fsy);
  gl.uniform1f(uScene.uSpin, params.spin);
  gl.uniform1i(uScene.uMaxSteps, QUALITY[params.quality].steps);
  gl.uniform1f(uScene.uDiskBright, params.disk);
  gl.uniform1f(uScene.uRingBoost, params.ring);
  gl.uniform1f(uScene.uDoppler, params.doppler ? 1 : 0);
  gl.uniform1f(uScene.uRedshift, params.redshift ? 1 : 0);
  gl.uniform1f(uScene.uStarBright, params.star);
  gl.uniform1f(uScene.uTexOn, params.tex ? 1 : 0);
  gl.uniform1f(uScene.uDiskThick, 0.05);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboBloom);
  gl.viewport(0, 0, hW, hH);
  gl.useProgram(brightProg);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, texScene);
  gl.uniform1i(uBright.uSceneTex, 0);
  gl.uniform2f(uBright.uTexelSize, 1/W, 1/H);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboBlur);
  gl.viewport(0, 0, hW, hH);
  gl.useProgram(blurHProg);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, texBloom);
  gl.uniform1i(uBlurH.uTex, 0);
  gl.uniform2f(uBlurH.uTexelSize, 1/hW, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboBloom);
  gl.viewport(0, 0, hW, hH);
  gl.useProgram(blurVProg);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, texBlur);
  gl.uniform1i(uBlurV.uTex, 0);
  gl.uniform2f(uBlurV.uTexelSize, 0, 1/hH);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(compProg);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, texScene);
  gl.uniform1i(uComp.uSceneTex, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, texBloom);
  gl.uniform1i(uComp.uBloomTex, 1);
  gl.uniform2f(uComp.uResolution, canvas.width, canvas.height);
  gl.uniform2f(uComp.uBloomTexel, 1/hW, 1/hH);
  gl.uniform1f(uComp.uTime, now * 0.001);
  gl.uniform1f(uComp.uExposure, 1.35);
  gl.uniform1f(uComp.uBloomAmt, params.bloom);
  gl.uniform1f(uComp.uFlare, params.flare ? 1.0 : 0.0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
requestAnimationFrame(render);
window.__cam = cam;
window.__params = params;
})();
</script>
